<style>
    body {
        background-image: url(https://wallpaperset.com/w/full/b/0/b/129600.jpg);
        background-size: cover;
        background-position: center;
          font-family: Arial, sans-serif;
    }


/* Main container for all text */
.gamebox {
    background: rgba(0, 0, 0, 0.75);   /* dark glass effect */
    backdrop-filter: blur(6px);       /* fancy modern blur */
    padding: 25px;
    border-radius: 12px;
    width: 420px;
    margin: 60px auto;
    text-align: center;
    box-shadow: 0 0 25px rgba(0,0,0,0.8);
}

/* Title */
h1 {
    color: #fffae6;
    font-size: 32px;
    letter-spacing: 1px;
    text-shadow: 2px 2px 8px black;
}

/* Input box */
input {
    width: 80%;
    padding: 10px;
    border-radius: 6px;
    border: none;
    font-size: 16px;
    margin-bottom: 10px;
}

/* Button that actually looks like a button */
button {
    background: #2fa4ff;
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #0d8af0;
}

/* Result text */
p {
    color: #fff;
    font-size: 18px;
    margin-top: 10px;
    text-shadow: 1px 1px 5px black;
}


</style>


    
    
    <br>
    <br>        
    <br>
    <br>
    <br>
    <center>
        <div class="gamebox">
    <h1>Guess the Number </h1>
    <input type="number" id="input"> 
    <button onclick="update()">Submit</button>
    <br>
    <p>Choose a number from 1 - 10</p>
    </p>
    <p id="result">

    </p>
    <p id="attempts">
        No .of attempts left : 10

    </p>
        </div>



</center>
<script>
    let attempts = 10;
    const input = document.getElementById("input");
    let result = document.getElementById("result");
    let showattempts = document.getElementById("attempts");

    const update = () => {
        const computer = Math.floor(Math.random()*10) + 1;
          if (attempts == 0) {
            result.textContent = `Your wrong, The correct answer is ${computer}`;
            showattempts.textContent = "You Lost";
            setTimeout (() => {
                alert("You Lost");
            },500);
            return;
        }
        else if (input.value === "" || input.value < 1 || input.value > 10) {
             result.textContent = "Please enter any no. from 1 - 10";
        }
        else if (input.value == computer) {
            result.textContent = `You won , you guess ${computer} is correct`;
            setTimeout(() => {
                 alert("You win");},500)
        } else {
            attempts -= 1
            result.textContent = `Your wrong, The correct answer is ${computer}`;
            showattempts.textContent = `You have ${attempts} attempts`;
        }
    }
</script>
